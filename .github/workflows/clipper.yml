name: GTA 6 clipper

on:
  schedule:
    # every 20 minutes, 24/7 (posts only go out 9 AM – 3 AM Toronto)
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      post_now:
        description: "Test: post clips ~10 min from now"
        type: boolean
        default: false
      alert_message:
        description: "Send this message to Jacob's phone"
        type: string
        default: ""
      caption_test_url:
        description: "Debug: test caption detection on a video URL"
        type: string
        default: ""
      cancel_name:
        description: "Cancel queued posts whose video name contains this"
        type: string
        default: ""
      yt_url:
        description: "Clip a YouTube video/VOD (most-replayed moments) and post"
        type: string
        default: ""
      yt_count:
        description: "How many clips from the YouTube video"
        type: string
        default: "4"
      preview:
        description: "Render a few clips for review (no posting)"
        type: boolean
        default: false
      test_alert:
        description: "Send a test phone alert"
        type: boolean
        default: false
      audit_only:
        description: "Only re-check queued posts and delete unsafe ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Toronto
      WHISPER_MODEL: base
      CAPTION_FONT: Montserrat
      AUTO_POST: "1"
      POST_NOW: ${{ inputs.post_now }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Message to phone
        if: ${{ inputs.alert_message != '' }}
        env:
          MSG: ${{ inputs.alert_message }}
        run: |
          T=$(grep ntfy_topic config.yaml | awk '{print $2}')
          curl -s -H "Title: Clipper update" -H "Tags: robot" -H "Priority: high" -d "$MSG" "https://ntfy.sh/$T"

      - name: Test phone alert
        if: ${{ inputs.test_alert }}
        run: |
          T=$(grep ntfy_topic config.yaml | awk '{print $2}')
          curl -s -H "Title: Test alert ✅" -H "Tags: moneybag" -H "Priority: high" \
            -d "Campaign alerts are working! When a Lacy / Clix / YourRAGE clip goes live you'll get one of these — then submit the links in Content Rewards." \
            "https://ntfy.sh/$T"
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + caption font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig tesseract-ocr > /dev/null
          mkdir -p ~/.fonts
          curl -sSL -o ~/.fonts/Montserrat.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
          fc-cache -f > /dev/null

      - name: Cache caption model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Safety audit of queued posts
        if: ${{ inputs.audit_only }}
        run: python clipper.py audit

      - name: Caption detection test
        if: ${{ inputs.caption_test_url != '' }}
        env:
          U: ${{ inputs.caption_test_url }}
          CAPTION_DEBUG: "1"
        run: |
          yt-dlp -q -f "best[ext=mp4]/best" -o /tmp/t.mp4 "$U"
          python -c "
          import sys; sys.argv=['x']
          import clipper as C; from pathlib import Path
          cfg=C.load_config(); w=C.transcribe(Path('/tmp/t.mp4'),'base')
          print('RESULT has_captions =', C.has_burned_captions(Path('/tmp/t.mp4'),0,60,w))"

      - name: Cancel queued posts
        if: ${{ inputs.cancel_name != '' }}
        env:
          CN: ${{ inputs.cancel_name }}
        run: python clipper.py cancel "$CN"

      - name: Clip YouTube video
        if: ${{ inputs.yt_url != '' }}
        env:
          YT_URL: ${{ inputs.yt_url }}
        run: python clipper.py ytvod "$YT_URL" --n ${{ inputs.yt_count }} --autopost

      - name: Preview render (no posting)
        if: ${{ inputs.preview }}
        run: python clipper.py run --any --max 4 --hours 12 --preview

      - name: Save preview stills
        if: ${{ inputs.preview }}
        run: |
          mkdir -p preview && rm -f preview/*.jpg
          for f in work/review/*.mp4; do
            n=$(basename "$f" .mp4)
            ffmpeg -v error -y -i "$f" -vf "fps=1/6,scale=270:-2,tile=4x1" -frames:v 1 "preview/$n.jpg"
            cp "$f" "preview/$n.mp4"
          done
          git config user.name "clipper-bot"; git config user.email "clipper-bot@users.noreply.github.com"
          git checkout -q -B previews && git add preview && git commit -qm "preview stills" && git push -q -f origin previews || true

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.preview }}
        with:
          name: preview
          path: work/review/*.mp4

      - name: Find, edit and schedule clips
        if: ${{ !inputs.audit_only && !inputs.preview && inputs.yt_url == '' && inputs.caption_test_url == '' }}
        run: python clipper.py run --max ${{ inputs.post_now && 3 || 2 }} --hours ${{ inputs.post_now && 24 || 12 }} --autopost

      - name: Save progress
        if: ${{ always() && !inputs.preview }}
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add work/state.db
          git diff --cached --quiet || (git commit -q -m "clipper run $(date '+%a %H:%M')" && git push -q)

      - name: Alert on failure
        if: failure()
        run: |
          T=$(grep ntfy_topic config.yaml | awk '{print $2}')
          curl -s -H "Title: ⚠️ Clipper run failed" -H "Tags: warning" -H "Priority: high" \
            -d "A clipper run crashed at $(date '+%I:%M %p'). Queued posts still go out. Claude checks and fixes this on the next check-in." \
            "https://ntfy.sh/$T"
