name: GTA 6 clipper

on:
  schedule:
    # every hour, 9 AM – midnight Toronto time (UTC 14:00–05:00)
    - cron: "7 14-23 * * *"
    - cron: "7 0-4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Toronto
      WHISPER_MODEL: base
      CAPTION_FONT: Montserrat
      AUTO_POST: "1"
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + caption font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig > /dev/null
          mkdir -p ~/.fonts
          curl -sSL -o ~/.fonts/Montserrat.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
          fc-cache -f > /dev/null

      - name: Cache caption model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Find, edit and schedule clips
        run: python clipper.py run --max 2 --hours 6 --autopost

      - name: Save progress
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add work/state.db
          git diff --cached --quiet || (git commit -q -m "clipper run $(date '+%a %H:%M')" && git push -q)
