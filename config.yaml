# ── What to clip ──────────────────────────────────────────────
# Exact Twitch category name. Run `python clipper.py check` to confirm it resolves.
game_name: "Grand Theft Auto VI"

# ONLY streamers you have permission to clip (a paid Content Rewards / Clipping
# campaign, or a streamer who openly allows clippers). Use `discover` to find who's hot.
streamers: auto            # auto = clip the biggest GTA 6 streamers right now
auto:
  top_n: 30                  # follow every big streamer who is live on GTA 6
  block_streamers: [TheBurntPeanut]   # never clip these
  # Only household-name streamers (Twitch usernames). The most viral clips among these win.
  only_streamers: [KaiCenat, IShowSpeed, xQc, Jynxzi, caseoh_, HasanAbi, zackrawrr, Lacy, jasontheween,
                   stableronaldo, summit1g, TimTheTatman, Ninja, shroud, sodapoppin, moistcr1tikal,
                   Agent00, Fanum, sketch, ohnePixel, LIRIK, ExtraEmily, Emiru, pokimane, tarik,
                   Clix, NICKMERCS, Tfue, plaqueboymax, BruceDropEmOff, Kaicenat]
  language: en              # English streams only (best for a Canadian/US audience)

fetch:
  lookback_hours: 12        # only clips made in the last X hours (fresh = algorithm boost)
  min_views: 3000            # fallback bar when nothing hits premium
  premium_views: 10000       # clips with 10k+ Twitch views always win
  min_seconds: 12           # skip tiny clips
  max_new_per_run: 6
  max_per_streamer: 99      # no limit — most viral wins

max_seconds: 25             # shorter = higher completion rate (~70% needed to go viral)
whisper_model: small        # tiny | base | small | medium  (small = good on a MacBook)
llm_model: claude-haiku-5-5 # used only if ANTHROPIC_API_KEY is set

# ── Look ──────────────────────────────────────────────────────
layout:
  mode: blur                # blur = gameplay centred on blurred background | stack = facecam on top
  game_aspect: 1.25         # how tightly to crop gameplay (lower = more zoom)
  lift: 60                  # push gameplay up a bit so captions sit below it

style:
  font: "Arial Black"
  caption_size: 86
  words_per_line: 3
  highlight_color: "&H0000F2FF"   # yellow (ASS colour format &HAABBGGRR)
  caption_y: 0.72                 # 0 = top, 1 = bottom
  hook_size: 64
  hook_margin: 170
  show_hook: false                # no text box at the top
  hook_seconds: 0                 # 0 = keep hook on screen for the whole clip
  trim_start: true                # cut dead air before the first word
  credit_template: "{streamer} • twitch.tv/{login}"

# ── Posting ───────────────────────────────────────────────────
posting:
  auto_post: false          # false = clips wait in work/review for `approve` (recommended)
  backend: buffer           # buffer (free) or uploadpost
  platforms: [tiktok, instagram, youtube]
  # Posting slots (Toronto time) — weighted to 2026 peak-engagement windows:
  # lunch scroll, after-school/after-work, prime-time evening, West-Coast evening.
  slots_weekday: ["09:30", "12:00", "13:00", "15:00", "16:30", "17:30", "18:30",
                  "19:30", "20:15", "21:00", "21:45", "22:30", "23:30", "00:30"]
  slots_weekend: ["09:00", "10:30", "12:00", "13:00", "14:30", "15:30", "16:30",
                  "17:30", "18:30", "19:30", "20:30", "21:30", "22:30", "00:00"]
  instagram_slots: ["12:00", "13:00", "19:30", "20:15", "20:30", "21:00", "22:30", "00:00", "00:30"]
  horizon_hours: 3          # normal clips: only fill peak slots in the next 3 h (fresh only)
  fast_lane_views: 10000    # 10k+ view clips skip the slot schedule and post ~10 min after being found
  daily_cap: 14             # max posts per day (TikTok allows ~15)
  active_hours: [9, 27]     # posting window 9 AM – 3 AM Toronto
  hashtags: ["#gta6", "#gtavi", "#gta", "#twitch", "#fyp"]

work_dir: work
